apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: domain-payments
  name: developer-restricted-role
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: []   # Strict denial: zero read/write access to Secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bind-developer-payments
  namespace: domain-payments
subjects:
- kind: Group
  name: "oidc:engineering-payments"
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: developer-restricted-role
  apiGroup: rbac.authorization.k8s.io
